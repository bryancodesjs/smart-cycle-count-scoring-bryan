services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_cycle_count
    volumes:
      - sccs_pg_data:/var/lib/postgresql/data

volumes:
  sccs_pg_data:
